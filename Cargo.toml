[package]
name = "bevy_rblx"
version = "0.1.4"
edition = "2024"
build = "src/build.rs"
authors = ["Radiant"]
description = "Running Roblox games inside Bevy Game Engine"
license = "MPL-2.0"
repository = "https://github.com/radiantgurl/bevy_rblx.git"

[dependencies]
bevy_rblx_derive = { version = "0.1.4", path = "crates/bevy_rblx_derive" }
mlua = { version = "^0.11", features = ["async", "luau", "luau-jit", "mlua_derive", "vendored", "send", "macros"] }
bevy = "^0.18"

bevy-async-commands = "^0.3"
bevy-async-ecs = "^0.10"
bevy-inspector-egui = "^0.36"
bevy_egui = "^0.39"
avian3d = { version = "0.6", features = ["enhanced-determinism"] }
arboard = { version = "^3.x", features = ["wl-clipboard-rs", "wayland-data-control"]}

clap = { version = "^4.6", features = ["cargo"] }
chrono = "0.4.44"
inventory = "^0.3"
concat-idents = "^1.1"
lazy_static = "^1.5"
parking_lot = "^0.12"
ptree = "^0.5"
static_assertions = { version = "^1.1", features = ["nightly"] }
crossterm = "0.29"
ratatui = {version = "0.30.1", features = ["unstable-rendered-line-info"] }

rbx_binary = "^2.0"
rbx_dom_weak = "4.1.0"
rbx_types = "3.1.0"

[workspace]
members = ["crates/bevy_rblx_derive"]

[features]
deprecated = []
multiplayer = []

[profile.release]
opt-level = 3
lto = true
debug = 1
split-debuginfo = "packed"

[profile.test-release]
inherits = "release"
lto=false
debug = 2
split-debuginfo = "off"
